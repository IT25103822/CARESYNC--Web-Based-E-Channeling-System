<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/caresync-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>CareSync - Web-Based E-Channeling System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #020617; color: white; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
        <img src="/caresync-logo.png" alt="CareSync Logo" style="width: 72px; height: 72px; border-radius: 20px; object-fit: contain; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(16,185,129,0.3); background: white; padding: 4px;" />
        <div style="width: 44px; height: 44px; border: 4px solid rgba(16, 185, 129, 0.2); border-top-color: #10b981; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <h2 style="margin-top: 18px; font-weight: 900; font-size: 20px; letter-spacing: -0.02em; color: #f8fafc;">CareSync</h2>
        <p style="margin-top: 6px; font-size: 12px; color: #94a3b8; font-weight: 500;">Your Health, Our Priority • Loading Channeling Network...</p>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
