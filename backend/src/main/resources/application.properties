server.port=8080
spring.application.name=echanneling-backend

# ----------------------------------------------------------------------------
# Microsoft SQL Server (Localhost SQLEXPRESS) Configuration
# ----------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=EChannelingDB;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=echanneling_user
spring.datasource.password=password123

# ----------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Exact column & table name matching (Preserves PascalCase / exact @Column names)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Colombo
spring.jackson.deserialization.accept-empty-string-as-null-object=true

# ----------------------------------------------------------------------------
# HikariCP Connection Pool Resilience & Auto-Reconnect
# ----------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=60000

# ----------------------------------------------------------------------------
# Support Large Base64 Profile Photos and Multipart Requests
# ----------------------------------------------------------------------------
server.tomcat.max-http-form-post-size=25MB
server.tomcat.max-swallow-size=25MB
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

